<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Карта Контроля Территорий</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#000}
#map{width:100%;height:100%;position:absolute;top:0;left:0;touch-action:none}
.panel{position:absolute;top:8px;right:8px;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);border-radius:6px;z-index:1000;box-shadow:0 3px 10px rgba(0,0,0,.6);width:110px;border:1px solid rgba(255,255,255,.12);overflow:hidden}
.panel-header{background:rgba(255,255,255,.06);padding:3px 6px;font-size:9px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.panel-header:active{background:rgba(255,255,255,.2)}
.panel-body{padding:3px;display:flex;flex-direction:column;gap:2px;max-height:78vh;overflow-y:auto}
.panel.collapsed .panel-body{display:none}
.btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);padding:3px 6px;border-radius:3px;cursor:pointer;font-size:9px;line-height:1.2;text-align:left;min-height:22px;display:flex;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:active{background:rgba(255,255,255,.28)}
.btn.active{background:rgba(255,255,255,.35);border-color:#fff;box-shadow:0 0 5px rgba(255,255,255,.35)}
hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:1px 0}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.95);color:#fff;padding:6px 12px;border-radius:6px;font-size:11px;border:1px solid rgba(255,255,255,.2);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;max-width:92vw;text-align:center;line-height:1.3}
#loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 14px;border-radius:6px;font-size:11px;z-index:2000;display:none;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.2)}
#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:5px 11px;border-radius:12px;font-size:10px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:1000;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#aaa!important;font-size:9px!important}
.leaflet-control-attribution a{color:#eee!important}
/* Switcher between OSM and ESRI satellite — minimal, fits existing panel aesthetic */
.base-layer-switcher{display:flex;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:2px}
.base-layer-btn{flex:1;background:transparent;border:none;color:rgba(255,255,255,.7);font-size:9px;padding:3px 4px;border-radius:2px;cursor:pointer;font-weight:600;line-height:1.1;-webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap}
.base-layer-btn:active{background:rgba(255,255,255,.2)}
.base-layer-btn.active{background:rgba(255,255,255,.35);color:#fff;box-shadow:0 0 4px rgba(255,255,255,.3) inside}
/* Replay status banner — жёлтое свечение снизу по центру, не блокирует тычков */
#replay-status{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);color:#fff;padding:6px 14px;border-radius:14px;font-size:11px;font-weight:600;z-index:1500;border:1px solid rgba(250,204,21,.6);box-shadow:0 0 18px rgba(250,204,21,.4);backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;pointer-events:none;max-width:92vw;white-space:nowrap}
.replay-dot{width:8px;height:8px;border-radius:50%;background:#facc15;animation:replayPulse 1s infinite;flex-shrink:0}
@keyframes replayPulse{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
#replay-progress{color:rgba(255,255,255,.6);font-weight:500;font-size:10px}
.hidden{display:none!important}
/* === Units === */
/* Sub-panel для выбора юнита: слева от основной панели, не перекрывает карту */
#units-panel{position:absolute;top:8px;right:124px;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);border-radius:6px;z-index:1000;box-shadow:0 3px 10px rgba(0,0,0,.6);width:240px;border:1px solid rgba(255,255,255,.12);overflow:hidden;max-height:78vh;display:flex;flex-direction:column}
.units-body{padding:4px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;max-height:70vh}
.unit-tabs{display:flex;gap:2px;padding:3px 3px 0}
.unit-tab{flex:1;background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.14);padding:4px 6px;border-radius:3px;cursor:pointer;font-size:10px;font-weight:600;text-align:center;-webkit-tap-highlight-color:transparent;user-select:none}
.unit-tab:active{background:rgba(255,255,255,.2)}
.unit-tab.active{background:rgba(255,255,255,.32);color:#fff}
.unit-tab.ua.active{border-color:#38bdf8;color:#7dd3fc}
.unit-tab.ru.active{border-color:#f87171;color:#fca5a5}
.unit-search{width:100%;background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:4px 6px;font-size:10px;margin:3px 0;box-sizing:border-box}
.unit-search::placeholder{color:rgba(255,255,255,.4)}
.unit-search:focus{outline:none;border-color:rgba(255,255,255,.4)}
.unit-item{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);padding:4px 6px;border-radius:3px;cursor:pointer;font-size:10px;line-height:1.2;display:flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;user-select:none}
.unit-item:active{background:rgba(255,255,255,.2)}
.unit-item.active{background:rgba(255,255,255,.32);border-color:#fff;box-shadow:0 0 5px rgba(255,255,255,.3)}
.unit-item.ua{border-left:3px solid #38bdf8}
.unit-item.ru{border-left:3px solid #f87171}
.unit-item .uimg{width:24px;height:24px;object-fit:contain;flex-shrink:0;background:rgba(0,0,0,.3);border-radius:2px}
.unit-item .usym{width:24px;height:16px;flex-shrink:0;background:rgba(0,0,0,.3);border-radius:2px;display:flex;align-items:center;justify-content:center}
.unit-item .usym svg{width:100%;height:100%;fill:#fff;stroke:#fff}
.unit-item .ulab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Marker на карте: логотип сверху, лейбл снизу */
.unit-marker{background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:2px;display:flex;flex-direction:column;align-items:center;min-width:38px;max-width:64px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.unit-marker.ua{border-color:#38bdf8;box-shadow:0 0 4px rgba(56,189,248,.4),0 2px 6px rgba(0,0,0,.6)}
.unit-marker.ru{border-color:#f87171;box-shadow:0 0 4px rgba(248,113,113,.4),0 2px 6px rgba(0,0,0,.6)}
.unit-marker img{width:32px;height:32px;object-fit:contain;border-radius:2px;pointer-events:none}
.unit-marker .usym{width:32px;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.unit-marker .usym svg{width:100%;height:100%;fill:#fff;stroke:#fff}
.unit-marker .ulab{font-size:9px;color:#fff;font-weight:700;line-height:1.1;padding:0 2px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;pointer-events:none}
/* Place-mode toggle button — в под-панели юнитов. Когда active, клик по карте ставит юнит. */
.btn-place{width:100%;background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.5);color:#bbf7d0;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:10px;font-weight:700;margin:3px 0;text-align:center;-webkit-tap-highlight-color:transparent;user-select:none}
.btn-place:active{background:rgba(34,197,94,.3)}
.btn-place.active{background:rgba(34,197,94,.5);color:#fff;border-color:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}
/* Replay speed slider — в основной панели */
.replay-speed{display:flex;flex-direction:column;gap:2px;margin:3px 0}
.replay-speed-row{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#aaa}
.replay-speed-row .val{color:#fff;font-weight:700}
.replay-speed input[type=range]{width:100%;height:14px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.1);border-radius:3px;outline:none}
.replay-speed input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;background:#facc15;border-radius:50%;cursor:pointer;box-shadow:0 0 4px rgba(250,204,21,.5)}
.replay-speed input[type=range]::-moz-range-thumb{width:12px;height:12px;background:#facc15;border:none;border-radius:50%;cursor:pointer}
/* Drone marker — силуэт сверху + подпись */
.drone-marker{background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;padding:2px;display:flex;flex-direction:column;align-items:center;width:36px;height:36px;box-shadow:0 2px 8px rgba(0,0,0,.7)}
.drone-marker.ua{border-color:#38bdf8;box-shadow:0 0 6px rgba(56,189,248,.5),0 2px 8px rgba(0,0,0,.7)}
.drone-marker.ru{border-color:#f87171;box-shadow:0 0 6px rgba(248,113,113,.5),0 2px 8px rgba(0,0,0,.7)}
.drone-marker svg{width:24px;height:24px;fill:#fff;stroke:#fff;flex-shrink:0}
.drone-marker .ulab{font-size:8px;color:#fff;font-weight:700;line-height:1;padding:0 2px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;pointer-events:none;margin-top:1px}
/* Strategic target marker — красный кружок-пин с иконкой */
.target-marker{background:rgba(220,38,38,.9);border:2px solid #fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;box-shadow:0 0 8px rgba(220,38,38,.6),0 2px 4px rgba(0,0,0,.5);font-weight:700}
.target-marker.destroyed{background:rgba(60,60,60,.9);border-color:#888;box-shadow:none;opacity:.6;filter:grayscale(1)}
/* === БПЛА — отдельное окно (левый верхний угол, оранжевая тема) === */
/* Чтобы отличить от панели юнитов — другой цвет и положение */
#drones-panel{position:absolute;top:8px;left:8px;background:rgba(20,12,8,.94);backdrop-filter:blur(10px);border-radius:6px;z-index:1000;box-shadow:0 0 20px rgba(251,146,60,.18),0 3px 10px rgba(0,0,0,.6);width:260px;border:1px solid rgba(251,146,60,.35);overflow:hidden;max-height:78vh;display:flex;flex-direction:column}
#drones-panel .units-body{padding:4px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;max-height:70vh}
#drones-panel .unit-tabs{display:flex;gap:2px;padding:3px 3px 0}
#drones-panel .unit-tab{background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.14)}
#drones-panel .unit-tab.active{background:rgba(251,146,60,.32);color:#fdba74;border-color:#fb923c}
#drones-panel .unit-tab.ua.active{border-color:#38bdf8;color:#7dd3fc}
#drones-panel .unit-tab.ru.active{border-color:#f87171;color:#fca5a5}
#drones-panel .unit-item{background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.18);border-left-width:3px}
#drones-panel .unit-item.ua{border-left-color:#38bdf8}
#drones-panel .unit-item.ru{border-left-color:#f87171}
#drones-panel .unit-item.active{background:rgba(251,146,60,.18);border-color:#fb923c;box-shadow:0 0 6px rgba(251,146,60,.4)}
#drones-panel .unit-search{background:rgba(0,0,0,.5);border-color:rgba(251,146,60,.25)}
#drones-panel .drone-marker{background:rgba(20,12,8,.9);border:2px solid #fb923c;box-shadow:0 0 8px rgba(251,146,60,.5),0 2px 8px rgba(0,0,0,.7)}
#drones-panel .drone-marker.ua{border-color:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,.55),0 2px 8px rgba(0,0,0,.7)}
#drones-panel .drone-marker.ru{border-color:#f87171;box-shadow:0 0 8px rgba(248,113,113,.55),0 2px 8px rgba(0,0,0,.7)}
.drone-marker{background:rgba(20,12,8,.9);border:2px solid #fb923c;border-radius:50%;padding:2px;display:flex;flex-direction:column;align-items:center;width:36px;height:36px;box-shadow:0 0 8px rgba(251,146,60,.5),0 2px 8px rgba(0,0,0,.7);transition:transform .15s}
.drone-marker.ua{border-color:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,.55),0 2px 8px rgba(0,0,0,.7)}
.drone-marker.ru{border-color:#f87171;box-shadow:0 0 8px rgba(248,113,113,.55),0 2px 8px rgba(0,0,0,.7)}
.drone-marker.selected{animation:dronePulse 0.8s infinite}
.drone-marker.flying{animation:droneFlying 0.4s infinite}
@keyframes dronePulse{0%,100%{box-shadow:0 0 8px rgba(251,146,60,.5),0 0 0 0 rgba(251,146,60,.6)}50%{box-shadow:0 0 16px rgba(251,146,60,.8),0 0 0 8px rgba(251,146,60,0)}}
@keyframes droneFlying{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
/* Mission-mode banner — показывает что дрон выбран и ждёт назначения точки */
#mission-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(20,12,8,.95);border:1px solid #fb923c;border-radius:14px;padding:6px 14px;color:#fdba74;font-size:11px;font-weight:600;z-index:1500;box-shadow:0 0 16px rgba(251,146,60,.4);display:flex;align-items:center;gap:8px;pointer-events:auto;max-width:92vw}
#mission-banner button{background:rgba(251,146,60,.2);border:1px solid rgba(251,146,60,.5);color:#fdba74;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:700}
#mission-banner button:hover{background:rgba(251,146,60,.35);color:#fff}
/* Drone marker — силуэт сверху + подпись. Базовые стили ниже, отдельное окно для БПЛА — оранжевая тема (см. #drones-panel). */
@media (max-width:640px){.panel{top:6px;right:6px;width:106px}.panel-header{padding:4px 6px;font-size:10px}.btn{min-height:24px;font-size:10px}#toast{top:auto;bottom:66px;font-size:12px}#hint{bottom:12px;font-size:11px;padding:6px 12px}#replay-status{bottom:48px;font-size:12px;padding:8px 16px}#units-panel{top:6px;right:118px;width:200px;max-height:60vh}.units-body{max-height:54vh}#drones-panel{top:6px;left:6px;width:210px;max-height:55vh}#mission-banner{top:auto;bottom:70px;font-size:12px;padding:8px 14px}}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel" class="panel">
<div class="panel-header" onclick="togglePanel()"><span>Меню</span><span id="toggle-icon">^</span></div>
<div class="panel-body">
<div class="base-layer-switcher" style="margin-bottom:3px">
<button class="base-layer-btn active" data-period="2026" type="button" onclick="setPeriod('2026')">📅 2026</button>
<button class="base-layer-btn" data-period="2014" type="button" onclick="setPeriod('2014')">📅 2014</button>
</div>
<button id="btn-occupy" class="btn" onclick="setMode('occupy')">Оккупация</button>
<button id="btn-liberate" class="btn" onclick="setMode('liberate')">Освобождение</button>
<button id="btn-units" class="btn" onclick="setMode('units')">▶ Юниты</button>
<button id="btn-drones" class="btn" onclick="setMode('drones')">🛩 БПЛА</button>
<button id="btn-targets" class="btn" onclick="toggleTargets()">🎯 Цели</button>
<hr>
<div class="base-layer-switcher">
<button class="base-layer-btn active" data-layer="osm" type="button" onclick="setBaseLayer('osm')">🗺 OSM</button>
<button class="base-layer-btn" data-layer="esri" type="button" onclick="setBaseLayer('esri')">🛰 ESRI</button>
</div>
<hr>
<div class="replay-speed">
<div class="replay-speed-row"><span>Скорость Replay</span><span class="val" id="replay-speed-val">700 мс</span></div>
<input type="range" id="replay-speed" min="200" max="2000" step="100" value="700" oninput="updateReplaySpeed(this.value)">
</div>
<hr>
<button class="btn" onclick="fetchRepoData(true)">Импорт из GitHub</button>
<button class="btn" onclick="popUndo()">Отменить</button>
<button id="btn-replay" class="btn" onclick="startReplay()">▶ Replay</button>
</div>
</div>

<div id="units-panel" class="hidden">
<div class="unit-tabs">
<button class="unit-tab ua active" data-side="ua" type="button" onclick="switchUnitSide('ua')">🇺🇦 UA</button>
<button class="unit-tab ru" data-side="ru" type="button" onclick="switchUnitSide('ru')">🇷🇺 RU</button>
</div>
<div class="units-body">
<button id="btn-place" class="btn-place" type="button" onclick="togglePlaceMode()">⊕ Поставить на карту</button>
<input type="text" class="unit-search" id="unit-search" placeholder="Поиск юнита…" oninput="renderUnitList()" autocomplete="off">
<div id="unit-list"></div>
</div>
</div>

<div id="drones-panel" class="hidden">
<div class="unit-tabs">
<button class="unit-tab ua active" data-side="ua" type="button" onclick="switchDroneSide('ua')">🇺🇦 UA</button>
<button class="unit-tab ru" data-side="ru" type="button" onclick="switchDroneSide('ru')">🇷🇺 RU</button>
</div>
<div class="units-body">
<button id="btn-place-drone" class="btn-place" type="button" onclick="togglePlaceMode()">⊕ Поставить на карту</button>
<input type="text" class="unit-search" id="drone-search" placeholder="Поиск БПЛА…" oninput="renderDroneList()" autocomplete="off">
<div id="drone-list"></div>
</div>
</div>

<div id="toast"></div>
<div id="loader"><span id="loader-text">Загрузка...</span></div>
<div id="hint">1 палец/ЛКМ — обводка, 2 пальца/ПКМ — двигать</div>
<div id="replay-status" class="hidden"><span class="replay-dot"></span><span id="replay-text">Replay…</span><span id="replay-progress"></span></div>
<div id="mission-banner" class="hidden"><span id="mission-text">Дрон выбран — кликни на карту/цель для задания точки полёта</span><button onclick="cancelMission()">✕ Отмена</button></div>

<script>
window.addEventListener('error', e => {
    console.error('[global error]', e.error || e.message);
    try { showToast('Ошибка: ' + (e.message || 'неизвестная'), 4000); } catch(_) {}
});

// ================= КОНСТАНТЫ =================
const BUFFER_KM = 1.2;
// Анимация — чуть быстрее прежней (было 1400)
const FADE_MS = 1200;
// Софт-край маски в пикселях (масштабируется от r, с верхним потолком).
// Гарантирует, что при t=1 край не «щёлкнет» при снятии маски.
const MASK_SOFT_FRACTION = 0.15; // 15% от радиуса
const MASK_SOFT_MAX_PX   = 80;   // но не толще 80px
// Оvershoot радиуса: гарантирует, что при t=1 все точки delta внутри «чёрной» зоны
const MAXR_OVERSHOOT = 1.20;

const MAX_UNDO = 20;

const SIMPLIFY_DEEPSTATE = 0.0003;
const SIMPLIFY_LASSO = 0.00005;
const SIMPLIFY_OPS_INPUT = 0.0002;
const SIMPLIFY_OPS_RESULT = 0.0002;
const SIMPLIFY_RENDER = 0.0003;
const SIMPLIFY_BUFFER_INPUT = 0.0006;
const MERGE_PAD = 0.0002;
const RENDER_SIMPLIFY_MIN = 4000;

// ================= REPLAY =================
// Базовая задержка между кадрами (мс). Может меняться слайдером скорости в
// панели (replayFrameMs). Меньше = быстрее проигрывание.
const REPLAY_FRAME_MS_DEFAULT = 700;

// ================= КАРТА =================
const map = L.map('map', {
    center: [48.5, 31.0], zoom: 6, minZoom: 5, maxZoom: 18,
    maxBounds: [[43.0, 20.0], [54.0, 42.0]],
    attributionControl: true
});

// Конфиг базовых слоёв. ESRI World_Imagery — спутниковые тайлы,
// используется в tactical-картах DeepSeek-версии как «2-й вариант карты».
const TILE_LAYERS = {
    osm: {
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        options: {
            attribution: '© OpenStreetMap | DeepStateMap Data',
            detectRetina: false, keepBuffer: 1, updateWhenIdle: true
        }
    },
    esri: {
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        options: {
            attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics',

// ================= ГЕОМЕТРИЧЕСКИЕ УТИЛИТЫ =================
function isValidRing(r) {

    }
    if (t === 'MultiPolygon') {

                if (p[1] < minY) minY = p[1];
                if (p[1] > maxY) maxY = p[1];

// ================= SEED =================
function findSeedPoint(anchorFC, deltaFC) {
    let centroid;
    try { centroid = turf.centroid(deltaFC).geometry.coordinates; }
    catch (e) { return null; }
    if (!centroid || !isFinite(centroid[0]) || !isFinite(centroid[1])) return null;

    if (!anchorFC || !anchorFC.features || !anchorFC.features.length) {
        return [centroid[0], centroid[1]];
    }

    let dB = null;
    for (const f of deltaFC.features) {
        const b = getBB(f);
        if (!b) continue;
        if (!dB) dB = b.slice();
        else {
            if (b[0] < dB[0]) dB[0] = b[0];
            if (b[1] < dB[1]) dB[1] = b[1];
            if (b[2] > dB[2]) dB[2] = b[2];
            if (b[3] > dB[3]) dB[3] = b[3];
        }
    }
    const dBpad = dB ? [dB[0] - 0.5, dB[1] - 0.5, dB[2] + 0.5, dB[3] + 0.5] : null;

    let best = [centroid[0], centroid[1]];
    let bestDist = Infinity;
    const cX = centroid[0], cY = centroid[1];

    for (const f of anchorFC.features) {
        if (!f.geometry) continue;
        if (dBpad) {
            const bb = getBB(f);
            if (bb && !bboxIntersects(bb, dBpad)) continue;
        }
        try {
            const g = f.geometry;
            const rings = g.type === 'Polygon'
                ? g.coordinates
                : g.coordinates.flat(1);
            for (const ring of rings) {
                if (!Array.isArray(ring) || ring.length < 2) continue;
                const step = Math.max(1, Math.ceil(ring.length / 400));
                for (let i = 0; i < ring.length; i += step) {
                    const p = ring[i];
                    if (!p || !isFinite(p[0]) || !isFinite(p[1])) continue;
                    const dx = p[0] - cX, dy = p[1] - cY;
                    const d = dx * dx + dy * dy;
                    if (d < bestDist) { bestDist = d; best = [p[0], p[1]]; }
                }
            }
        } catch (e) {}
    }
    return best;
}

// ================= MAX RADIUS =================
/**
 * Максимальный радиус «волны» в пикселях.
 * Возвращает УВЕЛИЧЕННОЕ значение (overshoot), чтобы при t=1 все точки delta
 * оказались внутри «чёрной» зоны маски — тогда снятие маски не даёт щелчка.
 */
function computeMaxRadiusPx(deltaFC, seedLngLat) {
    const seedPt = map.latLngToContainerPoint([seedLngLat[1], seedLngLat[0]]);

    const pts = [];
    try {
        turf.coordEach(deltaFC, (coord) => {
            if (coord && isFinite(coord[0]) && isFinite(coord[1])) pts.push(coord);
        });
    } catch (e) {}
    if (!pts.length) return 60;

    const step = Math.max(1, Math.ceil(pts.length / 400));
    let maxR = 0;
    for (let i = 0; i < pts.length; i += step) {
        const p = pts[i];
        const px = map.latLngToContainerPoint([p[1], p[0]]);
        const d = Math.hypot(px.x - seedPt.x, px.y - seedPt.y);
        if (d > maxR) maxR = d;
    }
    const lp = pts[pts.length - 1];
    const lpx = map.latLngToContainerPoint([lp[1], lp[0]]);
    const ld = Math.hypot(lpx.x - seedPt.x, lpx.y - seedPt.y);
    if (ld > maxR) maxR = ld;

    return Math.max(maxR * MAXR_OVERSHOOT, 60);
}

// ================= MASK-АНИМАЦИЯ =================
/**
 * Важно:
 *  - Серая зона УЖЕ установлена (finalGrey) ДО вызова. Она не меняется ни в
 *    процессе, ни в финале — только в момент старта операции.
 *  - Упрощение финального FC уже посчитано заранее (finalSimplified).
 *  - В кадре — одна строка CSS на mask-image.
 *  - Софт-край маски задан в ПИКСЕЛЯХ и не «щёлкает» при снятии.
 */
function animateMaskReveal(opts) {
    const { mode, seedLngLat, maxRadiusPx, finalSimplified } = opts;
    const myToken = ++animToken;
    animBusy = true;
    lockMap();

    const svgEl = paneRedDelta.querySelector('svg');
    if (!svgEl) {
        // Fallback без SVG — мгновенная замена без анимации
        animBusy = false;
        unlockMap();
        if (mode === 'occupy') {
            redMainLayer.clearLayers();
            if (finalSimplified && finalSimplified.features && finalSimplified.features.length) {
                try { redMainLayer.addData(finalSimplified); } catch(e) {}
            }
        }
        redDeltaSet(null);
        cleanupLasso();
        return;
    }

    // Координаты seed ОДИН РАЗ, в системе координат SVG внутри paneRedDelta
    const mapRect = mapContainer.getBoundingClientRect();
    const svgRect = svgEl.getBoundingClientRect();
    const seedPt = map.latLngToContainerPoint([seedLngLat[1], seedLngLat[0]]);
    const cx = seedPt.x - (svgRect.left - mapRect.left);
    const cy = seedPt.y - (svgRect.top - mapRect.top);

    // Софт-край: 15% от радиуса, но не толще 80px.
    // Работает для любого r — маленькая delta получает тонкий мягкий контур,
    // большая — широкий.
    const buildMask = (r) => {
        const soft = Math.min(r * MASK_SOFT_FRACTION, MASK_SOFT_MAX_PX);
        const inner = Math.max(0, r - soft);
        if (mode === 'occupy') {
            return `radial-gradient(circle ${r}px at ${cx}px ${cy}px, black 0px, black ${inner}px, transparent ${r}px)`;
        }
        return `radial-gradient(circle ${r}px at ${cx}px ${cy}px, transparent 0px, transparent ${inner}px, black ${r}px)`;
    };

    // Стартовая маска — ДО первого rAF. Иначе на первом кадре delta мелькнёт целиком.
    svgEl.style.willChange = 'mask-image';
    const initMask = buildMask(1);
    svgEl.style.webkitMaskImage = initMask;
    svgEl.style.maskImage = initMask;

    const start = performance.now();

    function frame(now) {
        if (myToken !== animToken) return;

        const t = Math.min(1, (now - start) / FADE_MS);
        const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
        const r = Math.max(1, maxRadiusPx * eased);

        svgEl.style.webkitMaskImage = buildMask(r);
        svgEl.style.maskImage = buildMask(r);

        if (t < 1) {
            requestAnimationFrame(frame);
            return;
        }

        // ===== ФИНАЛЬНЫЙ КАДР =====
        // Occupy: нужно перекинуть redMain c oldSimplified на finalSimplified.
        // Делаем это СИНХРОННО + форсируем canvas redraw, чтобы не было
        // одного кадра, где delta уже очищена, а canvas ещё старый → моргание.
        if (mode === 'occupy') {
            redMainLayer.clearLayers();
            if (finalSimplified && finalSimplified.features && finalSimplified.features.length) {
                try { redMainLayer.addData(finalSimplified); } catch (e) {}
            }
            try {
                if (redMainRenderer && typeof redMainRenderer._redraw === 'function') {
                    redMainRenderer._redraw();
                }
            } catch (e) {}
        }
        // Liberate: redMain уже = finalSimplified с самого начала, менять не нужно.

        // Снимаем маску и убираем delta. Серая — уже установлена, НЕ трогаем.
        svgEl.style.webkitMaskImage = 'none';
        svgEl.style.maskImage = 'none';
        svgEl.style.willChange = '';
        redDeltaSet(null);

        animBusy = false;
        unlockMap();
        cleanupLasso();
    }

    requestAnimationFrame(frame);
}

// ================= RED РЕНДЕР =================
function redMainSet(fc) {

        try { redMainLayer.addData(fc); } catch (e) {}
    }
}
function redDeltaSet(fc) {
    redDeltaLayer.clearLayers();
    if (fc && fc.features && fc.features.length) {
        try { redDeltaLayer.addData(fc); } catch (e) {}
    }
}

    cancelAnimation();
    redDeltaSet(null);
    redMainSet(fc ? simplifyFCForRender(fc) : null);
}

// ================= GREY =================
function greySetInstant(zone) {
    greyLayer.clearLayers();
    if (zone) {

            const fc = toFC(zone);
            if (fc.features.length) greyLayer.addData(fc);
        } catch (e) {}
    }

function buildGreyZone(fc) {

    const buffers = [];
    for (const f of fc.features) {
        try {
            const src = simplifyFeature(f, SIMPLIFY_BUFFER_INPUT);
            const b = turf.buffer(src, BUFFER_KM, { units: 'kilometers' });
            if (b && b.geometry && isValidPolygonFeature(b)) {
                const c = canonical(b);
                invalidateBB(c);
                buffers.push(c);
            }
        } catch (e) {}
    }
    if (!buffers.length) return null;
    if (buffers.length === 1) return buffers[0];
    let u = buffers[0];
    for (let i = 1; i < buffers.length; i++) {
        try {
            const r = turf.union(prepForOps(u), prepForOps(buffers[i]));
            if (r && isValidPolygonFeature(r)) u = simplifyOpsResult(canonical(r));
        } catch (e) {}
    }
    return u;

                    if (u && isValidPolygonFeature(u)) {

                        curBB = bboxPad(getBB(cur), MERGE_PAD);

    if (overlaps.length === 0) return turf.featureCollection([...fc.features, L]);
    let mergedOverlaps = overlaps[0];
    for (let i = 1; i < overlaps.length; i++) {
        try {
            const u = turf.union(prepForOps(mergedOverlaps), prepForOps(overlaps[i]));
            if (u && isValidPolygonFeature(u)) mergedOverlaps = simplifyOpsResult(canonical(u));
        } catch (e) {}
    }
    let merged = L;
    try {
        const u = turf.union(prepForOps(mergedOverlaps), prepForOps(L));
        if (u && isValidPolygonFeature(u)) merged = simplifyOpsResult(canonical(u));
    } catch (e) { merged = L; }
    return mergeAllTouching(turf.featureCollection([...rest, merged]));
}
function fcLiberateFast(fc, L) {
    const bLpad = bboxPad(getBB(L), MERGE_PAD);
    const out = []; const removedPieces = [];
    const Lp = prepForOps(L);
    for (const f of fc.features) {
        if (!bboxIntersects(bboxPad(getBB(f), MERGE_PAD), bLpad)) { out.push(f); continue; }
        let result = null;
        try { result = turf.difference(prepForOps(f), Lp); }
        catch (e) { out.push(f); continue; }
        if (result && isValidPolygonFeature(result)) {
            const cleaned = simplifyOpsResult(canonical(result));
            out.push(cleaned);
            try {
                const rem = turf.difference(prepForOps(f), prepForOps(cleaned));
                if (rem && isValidPolygonFeature(rem)) removedPieces.push(simplifyOpsResult(canonical(rem)));
            } catch (e) {}
        } else { removedPieces.push(f); }
    }
    let delta = null;
    if (removedPieces.length === 1) delta = removedPieces[0];
    else if (removedPieces.length > 1) {
        let u = removedPieces[0];
        for (let i = 1; i < removedPieces.length; i++) {
            try {
                const r = turf.union(prepForOps(u), prepForOps(removedPieces[i]));
                if (r && isValidPolygonFeature(r)) u = simplifyOpsResult(canonical(r));
            } catch (e) {}
        }
        delta = u;
    }
    return { fastFC: turf.featureCollection(out), delta };
}

// ================= СОХРАНЕНИЕ =================
function saveState() {
    saveStateToStorage();
    // Логируем действие для будущего Replay. currentMode в этот момент
    // ещё 'occupy' или 'liberate' (сбрасывается только при след. клике).
    pushUserAction(currentMode || 'edit');
}

/**
 * Сохраняет состояние в localStorage БЕЗ логирования в userActionLog.
 * Используется в applyPeriodData — там лог уже был сброшен и в него
 * добавлен 'init' pushUserAction, дополнительный 'edit' не нужен (было бы
 * два подряд идущих снапшота с одинаковым состоянием → рваный Replay).
 */
function saveStateToStorage() {
    try {
        const clean = {
            type: 'FeatureCollection',
            features: currentRedZoneFC.features.map(f => ({
                type: 'Feature', properties: {}, geometry: f.geometry
            }))
        };
        if (currentRedZoneFC.features.length) localStorage.setItem('deepstate-map-save', JSON.stringify(clean));
        else localStorage.removeItem('deepstate-map-save');
    } catch (e) {}
}

/**
 * Пушит снапшот текущего состояния в userActionLog для будущего Replay.
 * trim до 50 последних — чтобы лог не разрастался бесконечно.
 */
function pushUserAction(action) {
    try {
        const clean = {
            type: 'FeatureCollection',
            features: currentRedZoneFC.features.map(f => ({
                type: 'Feature', properties: {}, geometry: f.geometry
            }))
        };
        userActionLog.push({ action, fc: clean, ts: Date.now() });
        if (userActionLog.length > 50) userActionLog = userActionLog.slice(-50);
    } catch (e) { console.error('[userActionLog] push failed:', e); }
}

/** Откат последнего действия из лога (используется при undo). */
function popUserAction() {
    if (userActionLog.length > 1) userActionLog.pop();
}

// ================= ПРИМЕНЕНИЕ =================
function applyInitialState() {
    if (!currentRedZoneFC.features.length) {
        redSetInstant(null);
        greySetInstant(null);
        return;
    }
    redSetInstant(currentRedZoneFC);
    greySetInstant(buildGreyZone(currentRedZoneFC));
}

// ================= ИНИЦИАЛИЗАЦИЯ =================
// NOTE: initApp() вызывается в самом конце скрипта, после объявления всех
// const-ов (unitsPanel, unitSearchEl и т.д.). Если вызвать здесь, попадаем
// в temporal dead zone: loadUnits() → renderUnitList() → access unitSearchEl
// до его объявления в const.
function normalizeSaved(parsed) {
    if (!parsed) return null;
    if (parsed.type === 'FeatureCollection') return parsed;
    if (parsed.type === 'Feature') return turf.featureCollection([parsed]);
    return null;
}
async function initApp() {
    try {
        const saved = localStorage.getItem('deepstate-map-save');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                const fc = normalizeSaved(parsed);
                if (fc && fc.features.length) {
                    fc.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
                    currentRedZoneFC = fc;
                }
                applyInitialState();
            } catch (e) {}
        }
        if (!currentRedZoneFC.features.length) await fetchRepoData();
        // Сбрасываем лог действий: это стартовая точка для будущего Replay.
        userActionLog = [];
        pushUserAction('init');
        loadUnits();
        loadDrones();
    } catch (e) { console.error('[initApp] fatal:', e); }
    finally { showLoader('', false); }
}
async function fetchRepoData(forceReset) {
    showLoader('Загрузка DeepState...', true);
    try {
        const gj = await fetchRawData();
        let latest = null;
        if (gj.features && gj.features.length) {
            latest = gj.features[gj.features.length - 1];
            let mx = 0;
            for (let i = 0; i < gj.features.length; i++) {
                const f = gj.features[i];
                if (f.properties && f.properties.date) {
                    // BUG FIX: переименовано с `t` → `parsedTime`, чтобы не
                    // shadowить внешний timeoutId (const-t в for-loop проходит
                    // из-за block-scope, но легко ловит ошибки при рефакторинге).
                    const parsedTime = Date.parse(f.properties.date);
                    if (parsedTime > mx) { mx = parsedTime; latest = f; }
                }
            }
        }
        if (latest) {
            if (forceReset) pushUndo();
            const simplified = simplifyFeature(canonical(latest), SIMPLIFY_DEEPSTATE);
            if (simplified.properties) { delete simplified.properties.__bb; delete simplified.properties.__simplified; }
            currentRedZoneFC = turf.featureCollection([simplified]);
            applyInitialState();
            // После загрузки данных с DeepState — стартовая точка лога.
            userActionLog = [];
            pushUserAction('init');
        }
    } catch (e) { console.error('[fetchRepo]', e); showToast('Не удалось загрузить данные'); }
    finally { showLoader('', false); }
}

/**
 * Чистая фетчилка: качает .gz, распаковывает, парсит, кэширует в rawGeoJSON.
 * НЕ трогает currentRedZoneFC — это важно для Replay, чтобы юзерский захват
 * территории не затирался последним слепком из GitHub при загрузке данных.
 */
async function fetchRawData() {
    const c = new AbortController();
    const timeoutId = setTimeout(() => c.abort(), 15000);
    const res = await fetch('https://cdn.jsdelivr.net/gh/cyterat/deepstate-map-data@main/deepstate-map-data.geojson.gz', { signal: c.signal });
    clearTimeout(timeoutId);
    if (!res || !res.ok) throw new Error('HTTP');
    const blob = await res.blob();
    let txt;
    if ('DecompressionStream' in window) {
        try {
            const ds = new DecompressionStream('gzip');
            txt = await new Response(blob.stream().pipeThrough(ds)).text();
        } catch (e) { txt = await decompressPako(blob); }
    } else { txt = await decompressPako(blob); }
    const gj = JSON.parse(txt);
    return gj;
}
async function decompressPako(blob) {
    const ab = await blob.arrayBuffer();
    return pako.inflate(new Uint8Array(ab), { to: 'string' });
}

// ================= ПЕРИОДЫ (2014 / 2026) =================
// 2026: данные с DeepState (cyterat/deepstate-map-data) — загружаются fetchRepoData.
// 2014: реальный слой Harvard HURI "Occupied Territories of Donetsk and Luhansk (May, 2014)"
//        через ArcGIS REST API. URL взят из загруженного пользователем файла.
let currentPeriod = '2026';
const PERIOD_CACHE = { '2014': null, '2026': null };

// URL для получения данных за 2014 год. Harvard HURI ArcGIS REST.
// Ранее я ошибочно проверил HEAD-запросом (вернул content-length: 0) и решил
// что URL не работает. На самом деле GET-запрос возвращает полный GeoJSON.
const URL_2014 = 'https://maps-huri-ws.net/arcgis/rest/services/religion/church_con_static/MapServer/2/query?where=1%3D1&outFields=*&f=geojson';

function setPeriod(period) {
    if (period === currentPeriod) return;
    currentPeriod = period;
    document.querySelectorAll('[data-period]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.period === period);
    });
    // Применяем данные периода
    if (period === '2014') {
        if (PERIOD_CACHE['2014']) {
            // Уже загружено — мгновенно
            applyPeriodData(PERIOD_CACHE['2014']);
            showToast('Сценарий 2014 (из кэша)');
        } else {
            // Загружаем с Harvard HURI
            showLoader('Загрузка данных за 2014...', true);
            load2014Data()
                .then(fc => {
                    PERIOD_CACHE['2014'] = fc;
                    applyPeriodData(fc);
                    showToast(`Сценарий 2014 загружен: ${fc.features.length} полигонов`);
                })
                .catch(e => {
                    console.error('[load2014]', e);
                    showToast('Не удалось загрузить данные 2014');
                })
                .finally(() => showLoader('', false));
        }
    } else {
        // 2026 — загружаем с DeepState (через fetchRepoData)
        showLoader('Загрузка данных 2026...', true);
        fetchRepoData(true).finally(() => showLoader('', false));
        showToast('Сценарий 2026 — текущая линия фронта');
    }
}

/**
 * Загружает реальные данные за май 2014 с Harvard HURI ArcGIS REST API.
 * Слой: "Occupied Territories of Donetsk and Luhansk (May, 2014)".
 * Возвращает GeoJSON FeatureCollection.
 */
async function load2014Data() {
    const res = await fetch(URL_2014);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const gj = await res.json();
    if (!gj.features || !gj.features.length) throw new Error('No features');
    // Канонизируем направление обводки (right-hand rule) и упрощаем
    const features = gj.features.map(f => {
        try {
            return simplifyFeature(canonical(turf.feature(f.geometry, { ...f.properties })), SIMPLIFY_DEEPSTATE);
        } catch (e) {
            return turf.feature(f.geometry, { ...f.properties });
        }
    });
    return turf.featureCollection(features);
}

function applyPeriodData(fc) {
    currentRedZoneFC = fc || turf.featureCollection([]);
    currentRedZoneFC.features.forEach(f => {
        if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; }
    });
    applyInitialState();
    // Сбрасываем лог действий — это новая стартовая точка
    userActionLog = [];
    pushUserAction('init');
    // Сохраняем в localStorage БЕЗ логирования (init уже в логе, дубликат не нужен)
    saveStateToStorage();
    // Обновляем список юнитов — в периоде 2014 показываем 2014-era юниты
    // (selUnit сбрасываем, т.к. выбранный юнит может не существовать в другом периоде)
    selUnit = { ua: null, ru: null };
    if (currentMode === 'units') renderUnitList();
    // Сбрасываем place mode (если активен)
    if (placeMode) {
        placeMode = false;
        if (btnPlace) btnPlace.classList.remove('active');
        if (btnPlaceDrone) btnPlaceDrone.classList.remove('active');
    }
}

// ================= РЕЖИМЫ / ВВОД =================
function setMode(mode) {
    if (animBusy) { showToast('Подождите…'); return; }

    // BUG FIX: если юзер переключает режим или выключает его во время
    // активной обводки — надо сбросить незавершённый лассо. Иначе на карте
    // остаётся «висячий» polyline + pointerDot, а флаг isDrawing продолжает
    // ловить следующий тач/мышь как продолжение старой линии.
    const switchedAway = currentMode && currentMode !== mode;
    const toggledOff  = currentMode === mode;
    if (switchedAway || toggledOff) {
        if (isDrawing) {
            isDrawing = false;
            trackLatLngs = [];
            cleanupLasso();
        }
        // При выходе из units/drones — выключаем place mode
        if (placeMode) {
            placeMode = false;
            if (btnPlace) btnPlace.classList.remove('active');
            if (btnPlaceDrone) btnPlaceDrone.classList.remove('active');
        }
        // И сбрасываем mission mode (дрон выбран, ждёт цели) при выходе из drones
        if (missionDrone) cancelMission();
    }

    currentMode = (currentMode === mode) ? null : mode;
    btnOccupy.classList.toggle('active', currentMode === 'occupy');
    btnLiberate.classList.toggle('active', currentMode === 'liberate');
    btnUnits.classList.toggle('active', currentMode === 'units');
    btnDrones.classList.toggle('active', currentMode === 'drones');
    // Sub-панели: показываем только нужный
    unitsPanel.classList.toggle('hidden', currentMode !== 'units');
    if (typeof dronesPanelEl !== 'undefined' && dronesPanelEl) {
        dronesPanelEl.classList.toggle('hidden', currentMode !== 'drones');
    }

    // Хинты подсказывают что делать в режиме.
    if (currentMode === 'units' || currentMode === 'drones') {
        const what = currentMode === 'units' ? 'юнит' : 'БПЛА';
        hint.textContent = `Выбери ${what} → жми «⊕ Поставить» → кликай на карту. Карта двигается как обычно. ПКМ по маркеру — удалить.`;
        hint.style.opacity = '1';
        // В отличие от occupy/liberate, в units/drones перетаскивание карты работает
        // (dragging.enable). placeMode — отдельная кнопка, включающая клик-для-установки.
        map.dragging.enable(); map.touchZoom.enable(); mapContainer.style.cursor = placeMode ? 'crosshair' : '';
    } else if (currentMode) {
        hint.textContent = '1 палец/ЛКМ — обводка, 2 пальца/ПКМ — двигать';
        hint.style.opacity = '1';
        map.dragging.disable(); map.touchZoom.enable(); mapContainer.style.cursor = 'crosshair';
    } else {
        hint.style.opacity = '0';
        map.dragging.enable(); map.touchZoom.enable(); mapContainer.style.cursor = '';
    }
}
function getLatLngFromPoint(x, y) {
    const r = mapContainer.getBoundingClientRect();
    return map.containerPointToLatLng(L.point(x - r.left, y - r.top));
}
mapContainer.addEventListener('contextmenu', e => e.preventDefault());

function showPointerDot(latlng) {
    if (!map.hasLayer(pointerDot)) pointerDot.addTo(map);
    pointerDot.setLatLng(latlng);
}
function hidePointerDot() {
    if (map.hasLayer(pointerDot)) map.removeLayer(pointerDot);
}
function startDraw(latlng) {
    isDrawing = true; trackLatLngs = [latlng];
    lassoPolyline.setLatLngs(trackLatLngs);
    if (!map.hasLayer(lassoPolyline)) lassoPolyline.addTo(map);
    showPointerDot(latlng);
}
function continueDraw(latlng) {
    // BUG FIX: защитная проверка — если трек пуст (стартовое состояние гонки),
    // не падаем на `trackLatLngs[trackLatLngs.length - 1]` → undefined → throw.
    if (!trackLatLngs.length) { startDraw(latlng); return; }
    const last = trackLatLngs[trackLatLngs.length - 1];
    if (map.latLngToContainerPoint(last).distanceTo(map.latLngToContainerPoint(latlng)) >= 3) {
        trackLatLngs.push(latlng);
        lassoPolyline.setLatLngs(trackLatLngs);
        pointerDot.setLatLng(latlng);
    }
}
function finishDraw() {
    if (!isDrawing) return;
    isDrawing = false;
    if (trackLatLngs.length > 2) {
        const pts = [...trackLatLngs]; trackLatLngs = [];
        pushUndo();
        processLasso(pts);
    } else {
        trackLatLngs = [];
        cleanupLasso();
    }
}

mapContainer.addEventListener('mousedown', e => {
    if (animBusy) return;
    if (e.button === 2) { isRmbPanning = true; lastRmbPos = { x: e.clientX, y: e.clientY }; mapContainer.style.cursor = 'grabbing'; return; }
    if (e.button === 0 && currentMode) {
        const ll = getLatLngFromPoint(e.clientX, e.clientY);
        // Приоритет 1: mission mode — дрон ждёт назначения цели. Клик по карте → fly.

            cancelMission();

        }

        if (placeMode) {

            else if (currentMode === 'drones') placeDrone(ll);
            return;
        }
        // Для occupy/liberate — рисуем лассо. Для units/drones без placeMode — ничего (drag работает)

    }

window.addEventListener('mousemove', e => {

    }

});
window.addEventListener('mouseup', e => {

    if (e.button === 0 && isDrawing && currentMode !== 'units' && currentMode !== 'drones') finishDraw();
});
mapContainer.addEventListener('touchstart', e => {
    if (!currentMode || animBusy) return;

    if (e.touches.length === 1) {

            flyDroneTo(missionDrone, ll.lat, ll.lng);

        if (placeMode && (currentMode === 'units' || currentMode === 'drones')) {
            e.preventDefault();
            if (currentMode === 'units') placeBrig(ll);
            else placeDrone(ll);

        }
        if (currentMode === 'occupy' || currentMode === 'liberate') {

    }
}, { passive: false });
mapContainer.addEventListener('touchmove', e => {
    if (!currentMode || animBusy) return;
    if (e.touches.length >= 2) {
        if (isDrawing) { isDrawing = false; cleanupLasso(); }
        return;
    }
    if (isDrawing && e.touches.length === 1 && currentMode !== 'units' && currentMode !== 'drones') {

}, { passive: false });

// ================= ОБРАБОТКА =================
function revertToPrevState() {
    cancelAnimation();
    const prev = undoStack.length > 0 ? undoStack[undoStack.length - 1] : null;
    currentRedZoneFC = prev ? JSON.parse(JSON.stringify(prev)) : turf.featureCollection([]);
    if (undoStack.length > 0) undoStack.pop();
    currentRedZoneFC.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
    redMainSet(currentRedZoneFC.features.length ? simplifyFCForRender(currentRedZoneFC) : null);
    greySetInstant(buildGreyZone(currentRedZoneFC));
    cleanupLasso();
}

function processLasso(latLngs) {
    if (animBusy) { revertToPrevState(); return; }
    const tStart = performance.now();

    const coords = latLngs.map(ll => [ll.lng, ll.lat]);
    coords.push([latLngs[0].lng, latLngs[0].lat]);

    let lasso;
    try {
        lasso = turf.polygon([coords]);
        lasso = turf.cleanCoords(lasso);
        lasso = turf.simplify(lasso, { tolerance: SIMPLIFY_LASSO, mutate: false });
        lasso = turf.buffer(lasso, 0);
        lasso = canonical(lasso);
        invalidateBB(lasso);
    } catch (e) { revertToPrevState(); return; }
    if (!isValidPolygonFeature(lasso)) { revertToPrevState(); return; }

    const aLasso = safeArea(lasso);
    const worldArea = 510e12;
    if (aLasso <= 0 || aLasso > worldArea * 0.3) { revertToPrevState(); return; }

    const oldFC = currentRedZoneFC;
    const aBefore = oldFC.features.reduce((s, f) => s + safeArea(f), 0);

    if (currentMode === 'occupy') {
        let fast;
        try { fast = fcOccupyFast(oldFC, lasso); }
        catch (e) { showToast('Ошибка операции'); revertToPrevState(); return; }

        const aAfterApprox = aBefore + safeArea(fast.delta);
        if (aAfterApprox > (aBefore + aLasso) * 1.15 || aAfterApprox < aBefore * 0.95) {
            showToast('Ошибка операции, откат'); revertToPrevState(); return;
        }

        const finalFC = finalizeOccupy(oldFC, lasso, fast.overlaps, fast.rest);
        currentRedZoneFC = finalFC;

        const deltaFC = fast.delta ? toFC(fast.delta) : null;
        if (!deltaFC || !deltaFC.features.length) {
            redSetInstant(finalFC);
            greySetInstant(buildGreyZone(finalFC));
            setTimeout(cleanupLasso, 100);
            saveState();
            return;
        }

        // ===== ПРЕДВЫЧИСЛЕНИЯ (вне rAF) =====
        const oldSimplified   = simplifyFCForRender(oldFC);
        const deltaSimplified = simplifyFCForRender(deltaFC);
        const finalSimplified = simplifyFCForRender(finalFC);
        // Серая — СРАЗУ финальная (юзер хочет её с самого начала, без пост-обновления).
        const finalGrey       = buildGreyZone(finalFC);

        // Ставим слои в стартовое положение
        redMainSet(oldSimplified);         // старая красная (до победного финала)
        redDeltaSet(deltaSimplified);      // delta сверху — её маскирует CSS
        greySetInstant(finalGrey);         // серая — сразу финальная, БОЛЬШЕ НЕ ТРОГАЕМ

        const tSetup = performance.now() - tStart;
        if (tSetup > 600) console.warn('[perf] occupy setup took', Math.round(tSetup), 'ms (>600ms budget)');

        // Seed: ближайшая точка границы oldFC к центроиду delta
        const seedCoords = findSeedPoint(oldFC, deltaFC);
        if (!seedCoords) {
            redMainSet(finalSimplified);
            cleanupLasso();
            saveState();
            return;
        }

        const maxR = computeMaxRadiusPx(deltaFC, seedCoords);

        animateMaskReveal({
            mode: 'occupy',
            seedLngLat: seedCoords,
            maxRadiusPx: maxR,
            finalSimplified
        });

        saveState();
        console.log('[timing] occupy TOTAL:', Math.round(performance.now() - tStart), 'ms');
        return;
    }

    if (currentMode === 'liberate') {
        if (!oldFC.features.length) { showToast('Нечего освобождать'); return; }

        let fast;
        try { fast = fcLiberateFast(oldFC, lasso); }
        catch (e) { showToast('Ошибка операции'); revertToPrevState(); return; }

        const aAfterApprox = fast.fastFC.features.reduce((s, f) => s + safeArea(f), 0);
        if (aAfterApprox > aBefore * 1.05 || (aBefore - aAfterApprox) > aLasso * 1.5 + aBefore * 0.03) {
            showToast('Ошибка операции, откат'); revertToPrevState(); return;
        }

        const finalFC = mergeAllTouching(fast.fastFC);
        currentRedZoneFC = finalFC;

        const deltaFC = fast.delta ? toFC(fast.delta) : null;
        if (!deltaFC || !deltaFC.features.length) {
            redSetInstant(finalFC);
            greySetInstant(buildGreyZone(finalFC));
            setTimeout(cleanupLasso, 100);
            saveState();
            return;
        }

        // ===== ПРЕДВЫЧИСЛЕНИЯ (вне rAF) =====
        const finalSimplified = simplifyFCForRender(finalFC);
        const deltaSimplified = simplifyFCForRender(deltaFC);
        // Серая — СРАЗУ финальная.
        const finalGrey       = buildGreyZone(finalFC);

        // ВАЖНО: на liberate redMain УЖЕ финальный — «стирание» delta обнажает
        // финальную (уже без удаляемой части) красную. Моргания нет.
        redMainSet(finalSimplified);
        redDeltaSet(deltaSimplified);   // delta сверху, маска её съедает изнутри круга
        greySetInstant(finalGrey);      // серая — сразу финальная, БОЛЬШЕ НЕ ТРОГАЕМ

        const tSetup = performance.now() - tStart;
        if (tSetup > 600) console.warn('[perf] liberate setup took', Math.round(tSetup), 'ms (>600ms budget)');

        // Seed: ближайшая точка границы newFC к центроиду delta
        const seedCoords = findSeedPoint(finalFC, deltaFC);
        if (!seedCoords) {
            cleanupLasso();
            saveState();
            return;
        }

        const maxR = computeMaxRadiusPx(deltaFC, seedCoords);

        animateMaskReveal({
            mode: 'liberate',
            seedLngLat: seedCoords,
            maxRadiusPx: maxR,
            finalSimplified
        });

        saveState();
        console.log('[timing] liberate TOTAL:', Math.round(performance.now() - tStart), 'ms');
        return;
    }
}

// ================= УПРАВЛЕНИЕ =================
function pushUndo() {
    const snap = currentRedZoneFC.features.length ? JSON.parse(JSON.stringify(currentRedZoneFC)) : null;
    if (snap) snap.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
    undoStack.push(snap);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
}
function popUndo() {
    if (!undoStack.length) { showToast('Нечего отменять'); return; }
    cancelAnimation();
    const prev = undoStack.pop();
    currentRedZoneFC = prev || turf.featureCollection([]);
    currentRedZoneFC.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
    redMainSet(currentRedZoneFC.features.length ? simplifyFCForRender(currentRedZoneFC) : null);
    greySetInstant(buildGreyZone(currentRedZoneFC));
    cleanupLasso();
    // Синхронно откатываем и лог действий: undo «выкидывает» последнее действие
    popUserAction();
    showToast('Отменено :)');
}

// ================= REPLAY =================
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showReplayStatus(text, current, total) {
    const el = document.getElementById('replay-status');
    document.getElementById('replay-text').textContent = text;
    document.getElementById('replay-progress').textContent = total ? `${current}/${total}` : '';
    el.classList.remove('hidden');
}
function hideReplayStatus() {
    document.getElementById('replay-status').classList.add('hidden');
}

/**
 * Replay теперь проигрывает ИСТОРИЮ ДЕЙСТВИЙ ПОЛЬЗОВАТЕЛЯ (init + каждый
 * occupy/liberate + каждый undo), а НЕ 310 исторических слепков с DeepState.
 *
 * Лог userActionLog уже ведётся pushUserAction() на каждом изменении
 * состояния. Здесь — просто итерируемся по нему и применяем каждый снапшот.
 */
function startReplay() {
    if (animBusy) { showToast('Подождите…'); return; }
    if (replayActive) { stopReplay(false); return; }

    // Если drawing-режим включён — выключаем (он мешает проигрыванию)
    if (currentMode) setMode(currentMode);

    if (!userActionLog.length) { showToast('Нет действий для replay'); return; }
    // Если в логе только init-снапшот (одно состояние) — проигрывать нечего
    if (userActionLog.length < 2) { showToast('Сделайте хотя бы 1 действие (захват/освобождение) перед replay'); return; }

    replayActive = true;
    const myToken = ++replayToken;

    // Сохраняем текущее состояние — вернёмся к нему после stopReplay
    try {
        replaySnapshotBefore = JSON.parse(JSON.stringify(currentRedZoneFC));
        replaySnapshotBefore.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
    } catch (e) { replaySnapshotBefore = null; }

    // Кнопку превращаем в Стоп
    btnReplay.textContent = '⏹ Стоп';
    btnReplay.classList.add('active');

    showReplayStatus('Replay: старт…', 0, userActionLog.length);
    runReplayFrames(myToken);
}

async function runReplayFrames(token) {
    // 1. Плавный fade out текущего состояния карты (1 → 0) перед началом проигрывания.
    //    Раньше код сразу ставил empty red zone и делал fade in из 0 — это давало
    //    рваный скачок «всё пропало → пусто → что-то появилось». Теперь сначала
    //    плавно прячем то что есть, потом уже начинаем воспроизведение.
    const introFadeMs = Math.min(replayFrameMs * 0.5, 400);
    await fadeRedPane(1, 0, introFadeMs);
    if (token !== replayToken) return;
    // Очищаем карту
    currentRedZoneFC = turf.featureCollection([]);
    redSetInstant(null);
    greySetInstant(null);
    if (token !== replayToken) return;
    await sleep(150);
    if (token !== replayToken) return;

    // 2. Проигрываем кадры лога: fade in новый кадр → hold → fade out перед след.
    const fadeMs = Math.min(replayFrameMs * 0.35, 280);
    const holdMs = Math.max(200, replayFrameMs - fadeMs * 2);

    for (let i = 0; i < userActionLog.length; i++) {
        if (token !== replayToken) return;

        const item = userActionLog[i];
        // Читаемое название действия для баннера
        const actionLabel = ({
            init:      'Старт',
            occupy:    'Оккупация',
            liberate:  'Освобождение',
            undo:      'Отмена',
            edit:      'Изменение'
        })[item.action] || item.action;
        showReplayStatus(`Replay: ${actionLabel}`, i + 1, userActionLog.length);

        // Применяем снапшот из лога. Глубокий клон, чтобы не мутировать оригинал.
        try {
            currentRedZoneFC = JSON.parse(JSON.stringify(item.fc));
            currentRedZoneFC.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
        } catch (e) { console.error('[replay] frame failed:', e); continue; }

        redSetInstant(currentRedZoneFC);
        // Серую зону во время replay НЕ пересчитываем (buildGreyZone дорогой:
        // turf.buffer на каждом кадре даст +300ms). Грэй скрыт, юзер видит
        // только движение красной границы — это и есть суть replay.
        greySetInstant(null);

        // Плавное появление кадра (fade in 0 → 1)
        await fadeRedPane(0, 1, fadeMs);
        if (token !== replayToken) return;
        // Hold — кадр виден некоторое время
        await sleep(holdMs);
        if (token !== replayToken) return;
        // Плавное исчезновение перед следующим кадром (fade out 1 → 0)
        await fadeRedPane(1, 0, fadeMs);
        if (token !== replayToken) return;
    }

    if (token === replayToken) stopReplay(true);
}

/**
 * Плавный fade opacity для paneRedMain. Использует CSS transition,
 * requestAnimationFrame для синхронизации, и промис для await.
 * Без «рваности» — opacity плавно меняется от from до to за ms миллисекунд.
 */
function fadeRedPane(from, to, ms) {
    return new Promise(resolve => {
        const pane = paneRedMain;
        if (!pane) { resolve(); return; }
        const start = performance.now();
        const step = (now) => {
            const t = Math.min(1, (now - start) / ms);
            const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
            const v = from + (to - from) * eased;
            pane.style.opacity = String(v);
            if (t < 1) requestAnimationFrame(step);
            else { pane.style.opacity = ''; resolve(); }
        };
        requestAnimationFrame(step);
    });
}

function stopReplay(completed) {
    replayToken++;
    replayActive = false;

    // Сбрасываем opacity панели (вдруг зависла на полпути fade)
    if (paneRedMain) paneRedMain.style.opacity = '';

    btnReplay.textContent = '▶ Replay';
    btnReplay.classList.remove('active');

    hideReplayStatus();

    // Восстанавливаем состояние, которое было до запуска replay.
    // Включая пересчёт серой зоны (один раз, не страшно).
    if (replaySnapshotBefore) {
        try {
            currentRedZoneFC = JSON.parse(JSON.stringify(replaySnapshotBefore));
            currentRedZoneFC.features.forEach(f => { if (f.properties) { delete f.properties.__bb; delete f.properties.__simplified; } });
            applyInitialState();
        } catch (e) { console.error('[replay] restore failed:', e); }
        replaySnapshotBefore = null;
    }

    showToast(completed ? 'Replay завершён' : 'Replay остановлен');
}

// Картинки эмблем убраны по просьбе юзера — используем только SVG-символы.
// Классификация по типу для SVG-символа. По мотивам оригинала из frontlinemap_update5.html,
// расширена под русские названия.
function brigType(label, name) {
    const s = label + ' ' + name;
    if (/СпП|специальн|ССО|ГУР|Омега|Скеля|Кракен|Ахмат/.test(s)) return 'spec';
    if (/морск\S* пехот|\bМП\b|ОБрМП|ОБрМП/.test(s)) return 'mar';
    if (/ДШ|ПДБр|ВДД|десант|аеромоб|АеМБр|АеБр/.test(s)) return 'air';
    if (/ГШБр|горн/.test(s)) return 'mtn';
    if (/ТБр|ТД|ГвТА|танков/.test(s)) return 'tank';
    if (/АБр|артиллер/.test(s)) return 'art';
    if (/МБр|МСБр|МСД|МПБр|мотопех|механиз|мотострел/.test(s)) return 'mech';
    return 'inf';
}

function switchUnitSide(side) {
    unitSide = side;
    document.querySelectorAll('.unit-tab').forEach(b => {
        b.classList.toggle('active', b.dataset.side === side);
    });
    renderUnitList();
}

function renderUnitList() {
    const q = (unitSearchEl.value || '').trim().toLowerCase();
    // В периоде 2014 показываем юниты эпохи 2014, иначе — современные (2026)
    const list = (currentPeriod === '2014' ? BRIG_2014 : BRIG)[unitSide] || [];
    const filtered = q ? list.filter(([label, name]) => (label + ' ' + name).toLowerCase().includes(q)) : list;
    unitListEl.innerHTML = '';
    const sel = selUnit[unitSide];
    for (const [label, name] of filtered) {
        const item = document.createElement('div');
        item.className = 'unit-item ' + unitSide + (sel && sel.label === label ? ' active' : '');
        // Только SVG-символ (картинки убраны)
        const thumb = document.createElement('span');
        thumb.className = 'usym';
        thumb.innerHTML = brigSvg(label, name);
        const lab = document.createElement('span');
        lab.className = 'ulab';
        lab.textContent = label;
        const tipWrap = document.createElement('span');
        tipWrap.style.flex = '1';
        tipWrap.style.overflow = 'hidden';
        tipWrap.style.textOverflow = 'ellipsis';
        tipWrap.style.whiteSpace = 'nowrap';
        tipWrap.textContent = name;
        item.append(thumb, lab, tipWrap);
        item.onclick = () => {
            selUnit[unitSide] = { label, name };
            renderUnitList();
            if (currentMode !== 'units') setMode('units');
            // Авто-включение режима установки: юзер выбрал юнит → скорее всего
            // сразу захочет поставить. Если уже в режиме units но placement off —
            // включаем placement.
            if (currentMode === 'units' && !placeMode) togglePlaceMode();
        };
        unitListEl.appendChild(item);
    }
    if (!filtered.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:6px;font-size:10px;color:#888;text-align:center';
        empty.textContent = 'Не найдено';
        unitListEl.appendChild(empty);
    }
}

function buildUnitMarkerIcon(side, label, name) {
    const el = document.createElement('div');
    el.className = 'unit-marker ' + side;
    // Только SVG-символ (картинки убраны)
    const sym = document.createElement('span');
    sym.className = 'usym';
    sym.innerHTML = brigSvg(label, name);
    el.appendChild(sym);
    const lab = document.createElement('span');
    lab.className = 'ulab';
    lab.textContent = label;
    if (label.length > 4) lab.style.fontSize = '8px';
    el.appendChild(lab);
    return L.divIcon({ className: '', html: el, iconSize: [46, 50], iconAnchor: [23, 25] });
}

function addBrig(side, label, name, lat, lng) {
    const m = L.marker([lat, lng], {
        draggable: true, keyboard: false, zIndexOffset: 600,
        icon: buildUnitMarkerIcon(side, label, name)
    }).addTo(unitLayer);
    m.bindTooltip(name, { direction: 'top', offset: [0, -22] });
    const rec = { side, label, name, lat, lng, m };
    m.on('dragend', () => {
        const q = m.getLatLng();
        rec.lat = q.lat; rec.lng = q.lng;
        saveUnits();
    });
    m.on('contextmenu', e => {
        e.originalEvent.preventDefault();
        unitLayer.removeLayer(m);
        brigs = brigs.filter(x => x !== rec);
        saveUnits();
    });
    m.on('click', () => {
        // ПКМ или клик — удалить. ЛКМ по существующему юниту тоже удаляет,
        // чтобы на мобиле было удобно. Перетаскивание — drag, не клик.
        unitLayer.removeLayer(m);
        brigs = brigs.filter(x => x !== rec);
        saveUnits();
    });
    brigs.push(rec);
    return rec;
}

function placeBrig(ll) {
    const b = selUnit[unitSide];
    if (!b) { showToast('Сначала выбери юнит из списка'); return; }
    addBrig(unitSide, b.label, b.name, ll.lat, ll.lng);
    saveUnits();
}

function saveUnits() {
    try {
        const clean = brigs.map(b => ({ side: b.side, label: b.label, name: b.name, lat: b.lat, lng: b.lng }));
        localStorage.setItem('territory-units', JSON.stringify(clean));
    } catch (e) {}
}
function loadUnits() {
    try {
        const saved = localStorage.getItem('territory-units');
        if (!saved) { renderUnitList(); return; }
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) {
            brigs = [];
            for (const u of arr) {
                if (u && u.side && u.label && u.name && isFinite(u.lat) && isFinite(u.lng)) {
                    addBrig(u.side, u.label, u.name, u.lat, u.lng);
                }
            }
        }
        renderUnitList();
    } catch (e) { renderUnitList(); }
}

// Юзер жаловался что установка юнитов через ЛКМ неудобна — ЛКМ конфликтует
// с перемещением карты. Решение: кнопка «⊕ Поставить» в под-панели. Когда
// active — следующий клик по карте ставит выбранный юнит/дрон, потом режим
// установки автоматически выключается (или остаётся если зажат shift).
let placeMode = false;
const btnPlace = document.getElementById('btn-place');
const btnPlaceDrone = document.getElementById('btn-place-drone');

function togglePlaceMode() {
    placeMode = !placeMode;
    if (btnPlace) btnPlace.classList.toggle('active', placeMode && currentMode === 'units');
    if (btnPlaceDrone) btnPlaceDrone.classList.toggle('active', placeMode && currentMode === 'drones');
    if (placeMode) {
        if (currentMode === 'units' && !selUnit[unitSide]) { showToast('Сначала выбери юнит'); placeMode = false; btnPlace.classList.remove('active'); return; }
        if (currentMode === 'drones' && !selDrone[droneSide]) { showToast('Сначала выбери БПЛА'); placeMode = false; btnPlaceDrone.classList.remove('active'); return; }
        showToast('Кликни на карту, чтобы поставить');
    }
}

function renderDroneList() {

    const filtered = q ? list.filter(d => (d.label + ' ' + d.name).toLowerCase().includes(q)) : list;

    for (const d of filtered) {

        item.className = 'unit-item ' + droneSide + (sel && sel.label === d.label ? ' active' : '');

        thumb.className = 'usym';
        thumb.innerHTML = DRONE_SVG[d.label] || '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#fff"/></svg>';
        const lab = document.createElement('span');
        lab.className = 'ulab';
        lab.textContent = d.label;
        const tipWrap = document.createElement('span');
        tipWrap.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        tipWrap.textContent = d.name;
        item.append(thumb, lab, tipWrap);
        item.onclick = () => {
            selDrone[droneSide] = { label: d.label, name: d.name };
            renderDroneList();
            if (currentMode !== 'drones') setMode('drones');
            if (currentMode === 'drones' && !placeMode) togglePlaceMode();
        };
        droneListEl.appendChild(item);

function buildDroneMarkerIcon(side, label, name) {

    sym.innerHTML = DRONE_SVG[label] || '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#fff"/></svg>';

function addDrone(side, label, name, lat, lng) {
    const m = L.marker([lat, lng], {
        draggable: true, keyboard: false, zIndexOffset: 700,
        icon: buildDroneMarkerIcon(side, label, name)
    }).addTo(droneLayer);
    m.bindTooltip(name + ' — ЛКМ: лететь к цели · ПКМ: удалить', { direction: 'top', offset: [0, -20] });
    const rec = { side, label, name, lat, lng, m, flying: false, target: null };
    m.on('dragend', () => { if (!rec.flying) { const q = m.getLatLng(); rec.lat = q.lat; rec.lng = q.lng; saveDrones(); } });
    m.on('contextmenu', e => { e.originalEvent.preventDefault(); droneLayer.removeLayer(m); drones = drones.filter(x => x !== rec); saveDrones(); if (missionDrone === rec) cancelMission(); });
    // ЛКМ по дрону → enter mission mode (выбрать дрон, ждать клика-цели).
    // Раньше клик удалял дрон — неудобно. Теперь: ПКМ для удаления, ЛКМ для миссии.
    m.on('click', e => {
        e.originalEvent.preventDefault();
        if (rec.flying) { showToast('Дрон уже в полёте'); return; }
        enterMissionMode(rec);
    });
    drones.push(rec);
    return rec;
}

    addDrone(droneSide, d.label, d.name, ll.lat, ll.lng);
    saveDrones();
}

/**
 * Запускает дрон к точке назначения. Анимация — rAF, плавно интерполирует
 * lat/lng от старта к финишу. Длительность ~3-6 сек, зависит от дистанции
 * (но не меньше 2 сек, чтобы было видно даже короткие полёты).
 * По прибытии: если рядом есть strategic target — запускает strikeTarget.
 */
function flyDroneTo(droneRec, destLat, destLng) {
    if (droneRec.flying) { showToast('Дрон уже в полёте'); return; }
    const startLat = droneRec.lat;
    const startLng = droneRec.lng;
    // Простая евклидова интерполяция lat/lng. turf.distance не нужен —
    // для анимации достаточно, чтобы скорость была «приемлемой для глаза».
    // Скорость: ~3 сек на 1 градус lat (~111 км) = ~37 км/с = очень быстро,
    // но визуально — плавно.
    const dLat = destLat - startLat;
    const dLng = destLng - startLng;
    const distDeg = Math.sqrt(dLat * dLat + dLng * dLng);
    // 2-6 секунд в зависимости от дистанции
    const durationMs = Math.min(6000, Math.max(2000, distDeg * 3000));
    const start = performance.now();

    droneRec.flying = true;
    droneRec.target = { lat: destLat, lng: destLng };
    // Помечаем .flying для CSS-анимации (пульс масштаб)
    const setFlyingClass = (on) => {
        const el = droneRec.m.getElement?.();
        el?.querySelector('.drone-marker')?.classList.toggle('flying', on);
    };
    setFlyingClass(true);

    // Рисуем линию маршрута
    const routeLine = L.polyline(
        [[startLat, startLng], [destLat, destLng === destLng ? destLng : startLng]],
        { color: '#fb923c', weight: 1.5, opacity: 0.6, dashArray: '4,4', interactive: false }
    ).addTo(map);
    routeLine.setLatLngs([[startLat, startLng], [destLat, destLng]]);

    const step = (now) => {
        const t = Math.min(1, (now - start) / durationMs);
        // easeInOutQuad для плавности на старте/финише
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const curLat = startLat + dLat * eased;
        const curLng = startLng + dLng * eased;
        droneRec.m.setLatLng([curLat, curLng]);
        // Обновляем линию: текущая позиция → цель
        routeLine.setLatLngs([[curLat, curLng], [destLat, destLng]]);

        if (t < 1) {
            requestAnimationFrame(step);
        } else {
            // Финал: дрон на точке
            droneRec.flying = false;
            droneRec.lat = destLat;
            droneRec.lng = destLng;
            setFlyingClass(false);
            // Дрон ИСЧЕЗАЕТ — fade out opacity маркера за ~400мс
            const droneIconEl = droneRec.m.getElement?.();
            if (droneIconEl) {
                droneIconEl.style.transition = 'opacity .4s ease-out, transform .4s ease-out';
                droneIconEl.style.opacity = '0';
                droneIconEl.style.transform = 'scale(0.3)';
                // Через 400мс убираем маркер с карты совсем (и линию маршрута)
                setTimeout(() => {
                    try { droneLayer.removeLayer(droneRec.m); } catch(e){}
                    try { map.removeLayer(routeLine); } catch(e){}
                    drones = drones.filter(x => x !== droneRec);
                    saveDrones();
                }, 450);
            } else {
                // fallback — если не нашли DOM-элемент
                setTimeout(() => { try { droneLayer.removeLayer(droneRec.m); } catch(e){} try { map.removeLayer(routeLine); } catch(e){} drones = drones.filter(x => x !== droneRec); saveDrones(); }, 600);
            }
            // Если рядом есть strategic target — наносим удар (с задержкой
            // чтобы было видно, как дрон пропал → произошёл взрыв)
            const nearbyTarget = findTargetAt(destLat, destLng, 0.2);
            if (nearbyTarget) {
                setTimeout(() => strikeTarget(nearbyTarget.t, nearbyTarget.m), 200);
                showToast(`«${droneRec.label}» поразил цель: ${nearbyTarget.t.name}`);
            } else {
                showToast(`«${droneRec.label}» уничтожен в точке назначения`);
            }
        }
    };
    requestAnimationFrame(step);
}

/** Ищет strategic target в радиусе ~R градусов от точки. */
function findTargetAt(lat, lng, R) {
    for (const tm of targetMarkers) {
        const dLat = tm.t.lat - lat;
        const dLng = tm.t.lng - lng;
        if (Math.sqrt(dLat * dLat + dLng * dLng) <= R) return tm;
    }
    return null;
}
function saveDrones() {
    try {
        const clean = drones.map(d => ({ side: d.side, label: d.label, name: d.name, lat: d.lat, lng: d.lng }));
        localStorage.setItem('territory-drones', JSON.stringify(clean));
    } catch (e) {}
}
function loadDrones() {
    try {
        const saved = localStorage.getItem('territory-drones');
        if (!saved) { renderDroneList(); return; }
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) {
            drones = [];
            for (const d of arr) {
                if (d && d.side && d.label && d.name && isFinite(d.lat) && isFinite(d.lng)) {
                    addDrone(d.side, d.label, d.name, d.lat, d.lng);
                }
            }
        }
        renderDroneList();
    } catch (e) { renderDroneList(); }
}

const targetLayer = L.layerGroup().addTo(map);
let targetMarkers = [];
let targetsVisible = false;

function buildTargetIcon(t, destroyed) {
    const el = document.createElement('div');
    el.className = 'target-marker' + (destroyed ? ' destroyed' : '');
    el.textContent = t.icon || '◉';
    return L.divIcon({ className: '', html: el, iconSize: [22, 22], iconAnchor: [11, 11] });
}
function renderTargets() {
    targetLayer.clearLayers();
    targetMarkers = [];
    if (!targetsVisible) return;
    for (const t of TARGETS) {
        const m = L.marker([t.lat, t.lng], {
            keyboard: false, zIndexOffset: 400, icon: buildTargetIcon(t, false)
        }).addTo(targetLayer);
        m.bindTooltip(`${t.icon} ${t.name} (${kindLabel(t.kind)})`, { direction: 'top', offset: [0, -10] });
        m.on('click', () => strikeTarget(t, m));
        targetMarkers.push({ t, m, destroyed: false });
    }
}
function kindLabel(k) {
    return ({ bridge: 'мост', refinery: 'НПЗ', plant: 'завод', station: 'АЗС', airbase: 'аэродром', navalbase: 'ВМБ', port: 'порт', datacenter: 'дата-центр', tep: 'ТЭС/ТЭЦ', ges: 'ГЭС', substation: 'подстанция', npp: 'АЭС' })[k] || k;
}
function toggleTargets() {
    targetsVisible = !targetsVisible;
    btnTargets.classList.toggle('active', targetsVisible);
    renderTargets();
    showToast(targetsVisible ? `Показано целей: ${TARGETS.length}` : 'Цели скрыты');
}
function strikeTarget(t, m) {
    // Анимация удара: 3 последовательных flash-кольца (взрывная волна)
    // разного цвета и размера + дым (затухающее тёмное облако) + в конце
    // цель становится серой «уничтоженной».
    const rec = targetMarkers.find(x => x.t === t);
    if (!rec || rec.destroyed) return;
    rec.destroyed = true;

    // Кольцо 1 — яркая жёлто-оранжевая вспышка (быстро, 0.5с)
    const flash1 = L.circleMarker([t.lat, t.lng], {
        radius: 4, color: '#fff', fillColor: '#fbbf24', fillOpacity: 1, weight: 3, interactive: false
    }).addTo(map);
    // Кольцо 2 — оранжево-красная волна (чуть медленнее, 0.7с)
    const flash2 = L.circleMarker([t.lat, t.lng], {
        radius: 6, color: '#f97316', fillColor: '#ef4444', fillOpacity: 0.8, weight: 2, interactive: false
    }).addTo(map);
    // Кольцо 3 — тёмный дым (затухает медленно, 1.2с)
    const smoke = L.circleMarker([t.lat, t.lng], {
        radius: 8, color: '#1f2937', fillColor: '#374151', fillOpacity: 0.6, weight: 1, interactive: false
    }).addTo(map);

    const start = performance.now();
    const totalMs = 1200;
    const animExplosion = () => {
        const dt = (performance.now() - start) / totalMs;
        if (dt >= 1) {
            // Финал
            try { map.removeLayer(flash1); } catch(e){}
            try { map.removeLayer(flash2); } catch(e){}
            try { map.removeLayer(smoke); } catch(e){}
            m.setIcon(buildTargetIcon(t, true));
            showToast(`${t.icon} ${t.name} — поражён`);
            return;
        }
        // flash1: быстро растёт и исчезает за первые 0.4 (0..0.33)
        const dt1 = Math.min(1, dt / 0.33);
        flash1.setRadius(4 + 18 * dt1);
        flash1.setStyle({ opacity: 1 - dt1, fillOpacity: (1 - dt1) * 0.9 });
        // flash2: растёт с задержкой, исчезает за 0.66
        const dt2 = Math.max(0, Math.min(1, (dt - 0.1) / 0.55));
        flash2.setRadius(6 + 24 * dt2);
        flash2.setStyle({ opacity: 1 - dt2, fillOpacity: (1 - dt2) * 0.7 });
        // smoke: появляется позже, растёт, медленно рассеивается
        const dt3 = Math.max(0, Math.min(1, (dt - 0.2) / 0.8));
        smoke.setRadius(8 + 32 * dt3);
        smoke.setStyle({ opacity: Math.max(0, 0.7 - dt3 * 0.7), fillOpacity: Math.max(0, 0.6 - dt3 * 0.6) });
        requestAnimationFrame(animExplosion);
    };
    requestAnimationFrame(animExplosion);

    // Доп. «встряска» — короткое увеличение маркера цели через CSS transform
    const targetEl = m.getElement?.();
    if (targetEl) {
        targetEl.style.transition = 'transform .15s ease-out';
        targetEl.style.transform = 'scale(1.6)';
        setTimeout(() => { targetEl.style.transform = 'scale(1)'; }, 200);
    }
}
